spring.application.name=spai

spring.ai.openai.api-key=keyid


spring.datasource.url=jdbc:mysql://localhost:3306/springai?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#자동으로 테이블을 만들지 않도록 설정
spring.ai.chat.memory.repository.jdbc.initialize-schema=never


spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#DDL 설정
spring.jpa.show-sql=true	